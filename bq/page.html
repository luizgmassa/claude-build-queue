<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>Build queue</title>
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; margin: 16px; background: #111; color: #ddd; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 14px; margin: 18px 0 6px; color: #9cf; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #9cf; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; table-layout: fixed; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #2a2a2a; vertical-align: middle;
           overflow: hidden; overflow-wrap: anywhere; }
  th { color: #888; font-weight: 600; position: relative; cursor: pointer; user-select: none; white-space: nowrap;
       text-overflow: ellipsis; }
  th:hover { color: #bbb; }
  .rz { position: absolute; right: 0; top: 0; width: 7px; height: 100%; cursor: col-resize; }
  .rz:hover, .rz.on { background: #456; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  /* a fixed size, so a refresh with longer numbers does not move the cards around */
  .card { background: #1b1b1b; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; width: 230px;
          box-sizing: border-box; white-space: nowrap; }
  .card.wide { width: 350px; }
  .card b { display: block; font-size: 20px; overflow: hidden; text-overflow: ellipsis;
            font-variant-numeric: tabular-nums; }
  .tri { margin-left: 5px; vertical-align: -1px; cursor: help; }
  /* one balloon for every [data-tip], fixed to the viewport: a table cell's overflow would clip it */
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none;
    white-space: pre; background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
    padding: 6px 9px; font-size: 12px; font-weight: normal; box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
  .ok { color: #6d6; } .warn { color: #fc4; } .bad { color: #f66; }
  code { color: #aaa; font-size: 11px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; color: #aaa; font-size: 11px; background: #181818;
        padding: 6px 8px; border-radius: 4px; margin: 0; }
  .muted { color: #777; }
  a.lnk { color: #8bf; cursor: pointer; text-decoration: none; }
  a.lnk:hover { text-decoration: underline; }
  dialog { background: #161616; color: #ddd; border: 1px solid #444; border-radius: 8px; padding: 0;
           width: min(1300px, 94vw); max-height: 88vh; overflow: auto; }
  html, dialog { overflow-anchor: none; }  /* a refresh must not follow the content as it grows */
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  .dh { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #333;
        position: sticky; top: 0; background: #161616; z-index: 1; }
  .dh b { flex: 1; font-size: 15px; }
  .dh button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 10px;
               cursor: pointer; }
  .dh button:disabled { opacity: .3; cursor: default; }
  #dlg-body { padding: 4px 14px 14px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 8px 0; }
  .kv > div:nth-child(odd) { color: #888; }
  #lang { float: right; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
  #cfg-open { float: right; margin-right: 8px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px;
              cursor: pointer; padding: 2px 10px; }
  #cfg { width: min(860px, 94vw); }
  #cfg-body { padding: 4px 16px 10px; }
  #cfg h3 { margin-top: 16px; }
  .f { display: grid; grid-template-columns: 230px 1fr; gap: 4px 14px; padding: 8px 0; border-bottom: 1px solid #222; }
  .f > label { color: #ccc; padding-top: 3px; }
  .help { color: #888; font-size: 12px; margin-top: 3px; }
  .err { color: #f66; font-size: 12px; }
  #cfg input, #cfg select, #cfg textarea { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px;
                                           padding: 3px 6px; font: inherit; }
  #cfg input[type=number] { width: 90px; }
  #cfg input:invalid { border-color: #f66; }
  #cfg textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 12px; }
  .prof { display: block; padding: 2px 0; }
  #cfg details > summary { cursor: pointer; color: #9cf; padding: 12px 0 4px; font-weight: 600; }
  .gb { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px 14px; }
  .gb label { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .df { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid #333;
        position: sticky; bottom: 0; background: #161616; }
  .df span { flex: 1; }
  .df button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 5px 12px;
               cursor: pointer; font: inherit; }
  .df button.primary { background: #234; border-color: #47a; font-weight: 600; }
  .df button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<button id="cfg-open">⚙ <span data-i18n="cfg.open"></span></button>
<select id="lang" data-i18n-title="language"><option value="en-US">EN-US</option><option value="pt-BR">PT-BR</option></select>
<h1><span data-i18n="title"></span> <span id="ts" class="muted"></span></h1>
<div id="cards"></div>
<div id="blocked" class="warn"></div>
<h2 data-i18n="h.running"></h2><div class="wrap"><table id="running"></table></div>
<h2 data-i18n="h.waiting"></h2><div class="wrap"><table id="waiting"></table></div>
<h2 data-i18n="h.agents"></h2><div class="wrap"><table id="agents"></table></div>
<h2 data-i18n="h.procs"></h2><div class="wrap"><table id="procs"></table></div>
<h2 id="wk-title"></h2><div class="wrap"><table id="would"></table></div>
<h2 data-i18n="h.done"></h2><div class="wrap"><table id="done"></table></div>
<h2 id="h-est"></h2>
<div class="wrap"><table id="est"></table></div>
<h2 data-i18n="h.events"></h2><div class="wrap"><table id="events"></table></div>

<dialog id="dlg">
  <div class="dh"><button id="dlg-back" data-i18n-title="back">←</button><b id="dlg-title"></b>
    <button id="dlg-x" data-i18n-title="close">×</button></div>
  <div id="dlg-body"></div>
</dialog>

<dialog id="cfg">
  <div class="dh"><b data-i18n="cfg.title"></b><button id="cfg-x" data-i18n-title="close">×</button></div>
  <div id="cfg-body"></div>
  <div class="df"><span id="cfg-msg"></span><button id="cfg-reset" data-i18n="cfg.reset"></button>
    <button id="cfg-cancel" data-i18n="cfg.cancel"></button><button id="cfg-save" class="primary" data-i18n="cfg.save"></button></div>
</dialog>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const secs = ts => ts ? Math.round(Date.now() / 1000 - ts) : null;
const dur = s => s == null ? "" : s < 60 ? s + "s" : s < 3600 ? Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s"
  : Math.floor(s / 3600) + "h" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
const etimeSecs = e => { if (!e) return null; const [d, rest] = e.includes("-") ? e.split("-") : [0, e];
  return rest.split(":").map(Number).reduce((a, x) => a * 60 + x, 0) + Number(d) * 86400; };
// ---------------------------------------------------------------- language
const I18N = JSON.parse(document.getElementById("i18n").textContent);
let lang = I18N[localStorage.bqLang] ? localStorage.bqLang
  : (navigator.language || "").toLowerCase().startsWith("pt") ? "pt-BR" : "en-US";
const fill = (s, p) => s.replace(/\{(\w+)\}/g, (_, k) => {
  const v = (p || {})[k];
  return v && typeof v === "object" ? tr(v) : String(v ?? "");
});
// text of a key in the current language; a key no language has (e.g. "PID") is shown as the fallback or as itself
function T(key, params, fallback) {
  const s = I18N[lang][key] ?? I18N["en-US"][key];
  return s == null ? (fallback ?? key) : fill(s, params);
}
// a server message {key, params}; a plain string is text from before messages had keys, shown as it is
function tr(m) { return m && typeof m === "object" ? T(m.key, m.params) : String(m ?? ""); }
function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("lang").value = lang;
  document.title = T("title");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-title]").forEach(e => e.title = T(e.dataset.i18nTitle));
}

const procLink = pid => pid ? `<a class="lnk" data-proc="${pid}">${pid}</a>` : "";
const agentLink = (pid, label, alive) => pid ? `<a class="lnk" data-agent="${pid}">${esc(label || "claude " + pid)}`
  + (alive === false ? " " + esc(T("agent_ended")) : "") + "</a>" : esc(label);
const clientOf = r => r.serving ? " → " + esc(T("client")) + " " + procLink(r.serving) : "";
const ownerOf = r => r.agent_pid ? agentLink(r.agent_pid, r.owner, r.agent_alive) : esc(T("owner." + r.owner, null, r.owner));

// ---------------------------------------------------------------- sortable, resizable tables
const S = { sort: JSON.parse(localStorage.bqSort || "{}"), widths: JSON.parse(localStorage.bqWidths || "{}") };
const save = () => { localStorage.bqSort = JSON.stringify(S.sort); localStorage.bqWidths = JSON.stringify(S.widths); };
const tables = {};  // id -> {cols, rows}, kept to re-render on sort without waiting for the next refresh
const cmp = (a, b) => (typeof a === "number" && typeof b === "number") ? a - b
  : String(a ?? "").localeCompare(String(b ?? ""), lang, { numeric: true, sensitivity: "base" });
const widthOf = (id, c) => (S.widths[id] || {})[c.k] || c.w || 110;

function grid(id, cols, rows) {
  tables[id] = { cols, rows };
  const el = document.getElementById(id);
  if (!el) return;
  const st = S.sort[id], col = st && cols.find(c => c.k === st.k);
  if (col) {
    const val = r => col.v ? col.v(r) : r[col.k];
    rows = rows.slice().sort((a, b) => cmp(val(a), val(b)) * st.d);
  }
  el.style.width = cols.reduce((sum, c) => sum + widthOf(id, c), 0) + "px";
  el.innerHTML = "<colgroup>" + cols.map(c => `<col style="width:${widthOf(id, c)}px">`).join("") + "</colgroup>"
    + "<thead><tr>" + cols.map((c, i) => `<th data-t="${id}" data-k="${c.k}" title="${esc(T("sort_by", { col: T(c.t) }))}">`
      + esc(T(c.t)) + (col && st.k === c.k ? (st.d > 0 ? " ▲" : " ▼") : "")
      + `<span class="rz" data-t="${id}" data-i="${i}"></span></th>`).join("") + "</tr></thead><tbody>"
    + (rows.length ? rows.map(r => "<tr>" + cols.map(c =>
        `<td class="${c.num ? "num" : ""}${c.cls ? " " + c.cls(r) : ""}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("") + "</tr>").join("")
      : `<tr><td class="muted" colspan="${cols.length}">${esc(T("empty"))}</td></tr>`) + "</tbody>";
}

let drag = null, justDragged = false;
document.addEventListener("mousedown", e => {
  const rz = e.target.closest(".rz");
  if (!rz) return;
  e.preventDefault(); e.stopPropagation();
  const id = rz.dataset.t, c = tables[id].cols[+rz.dataset.i];
  drag = { id, i: +rz.dataset.i, k: c.k, x: e.clientX, w: widthOf(id, c) };
  rz.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!drag) return;
  const w = Math.max(40, drag.w + e.clientX - drag.x);
  (S.widths[drag.id] = S.widths[drag.id] || {})[drag.k] = w;
  const el = document.getElementById(drag.id);  // re-query: a refresh may have rebuilt the table mid-drag
  const colEl = el && el.querySelectorAll("col")[drag.i];
  if (!colEl) return;
  colEl.style.width = w + "px";
  el.style.width = tables[drag.id].cols.reduce((sum, c) => sum + widthOf(drag.id, c), 0) + "px";
});
document.addEventListener("mouseup", () => {
  if (!drag) return;
  drag = null; justDragged = true; save();
  document.querySelectorAll(".rz.on").forEach(x => x.classList.remove("on"));
  setTimeout(() => justDragged = false, 0);  // the click that ends a drag must not also sort
});

document.addEventListener("click", e => {
  const a = e.target.closest("[data-proc],[data-agent]");
  if (a) { e.preventDefault(); openDetail(a.dataset.agent ? "agent" : "proc", +(a.dataset.agent || a.dataset.proc), true); return; }
  const th = e.target.closest("th[data-k]");
  if (!th || justDragged || e.target.closest(".rz")) return;
  const id = th.dataset.t, k = th.dataset.k, st = S.sort[id];
  S.sort[id] = { k, d: st && st.k === k ? -st.d : 1 };  // first click A→Z, next click Z→A
  save();
  grid(id, tables[id].cols, tables[id].rows);
});

// ---------------------------------------------------------------- column sets
// `t` is a translation key; a header no language translates (PID, % RAM) is its own text
const gb2 = x => x == null ? "" : x.toFixed(2);
// a small yellow warning triangle; its tooltip is the text in data-tip
const tipEl = Object.assign(document.createElement("div"), { id: "tip" });
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tipEl.style.display = "none"; return; }
  (el.closest("dialog") || document.body).appendChild(tipEl);  // an open modal dialog covers anything outside it
  tipEl.textContent = el.dataset.tip;
  tipEl.style.display = "block";
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(4, Math.min(r.left, innerWidth - w - 4)) + "px";
  tipEl.style.top = (r.bottom + 6 + h > innerHeight ? r.top - 6 - h : r.bottom + 6) + "px";
});
const triangle = tip => `<span class="tri" data-tip="${esc(tip)}"><svg viewBox="0 0 16 16" width="13" height="13">`
  + `<path d="M8 1.2 15.3 14.3H.7Z" fill="#e8b500"/><path d="M8 5.6v4.3M8 11.4v1.3" stroke="#111" stroke-width="1.7"/></svg></span>`;
const PROC_COLS = [
  { k: "pid", t: "PID", num: true, w: 70, f: r => procLink(r.pid) },
  { k: "ppid", t: "PPID", num: true, w: 70, f: r => procLink(r.ppid) },
  { k: "kind", t: "col.type", w: 110 },
  { k: "owner", t: "col.owner", w: 200, f: ownerOf },
  { k: "status", t: "col.state", w: 150, v: r => tr(r.status), cls: r => r.status?.key === "status.no_slot" ? "bad" : "",
    f: r => esc(tr(r.status)) + clientOf(r) },
  { k: "rss_gb", t: "col.mem_gb", num: true, w: 85, f: r => gb2(r.rss_gb) },
  { k: "ram_pct", t: "% RAM", num: true, w: 70 },
  { k: "cpu", t: "CPU%", num: true, w: 65 },
  { k: "etime", t: "col.age", w: 90, v: r => etimeSecs(r.etime) },
  { k: "ticket", t: "ticket", w: 60, num: true, v: r => r.ticket ? +r.ticket : null },
  { k: "cmd", t: "col.cmd", w: 520, f: r => `<code>${esc(r.cmd)}</code>` },
];
// a build outside the queue has no ticket: its # is the warning triangle, its state the tooltip
const T_ID = { k: "id", t: "#", num: true, w: 50,
  f: t => t.outside ? triangle(tr(t.status)) : t.runner ? "CI" : esc(t.id) };
const T_AGENT = { k: "agent", t: "col.agent", w: 220, f: t => agentLink(t.claude_pid, t.agent, t.agent_alive) };
const T_PID = { k: "pid", t: "col.gq_pid", num: true, w: 70, f: t => procLink(t.pid) };
const T_TYPE = { k: "ctype", t: "col.type", w: 110 };
const T_PROJ = { k: "project", t: "col.project", w: 180 };
const T_EST = { k: "estimate_gb", t: "col.estimate", num: true, w: 85, f: t => t.estimate_gb != null ? t.estimate_gb + " GB" : "" };
const T_CPU = { k: "cpu_pct", t: "% CPU", num: true, w: 70, f: r => r.cpu_pct != null ? r.cpu_pct + "%" : "" };
const T_RAM = { k: "rss_gb", t: "col.ram_now", num: true, w: 85, f: t => t.rss_gb != null ? t.rss_gb + " GB" : "" };
const T_PEAK = { k: "peak_gb", t: "col.peak", num: true, w: 75, f: t => t.peak_gb != null ? t.peak_gb + " GB" : "" };
const T_CMD = { k: "cmd", t: "col.cmd", w: 520, f: t => `<code>${esc(t.cwd)}$ ${esc(t.cmd)}</code>` };
// end_reason is stored as a plain value ("released", "owner process gone"); unknown values show as stored
const endReason = t => T("end." + t.end_reason, null, t.end_reason ?? "");
const T_END = { k: "end_reason", t: "col.end", w: 160, v: endReason,
  f: t => esc(endReason(t)) + (t.exit_code != null ? " (exit " + t.exit_code + ")" : "") };
// one column set per ticket state, shared by the main page and the dialogs
const TICKET_TABLES = [
  ["running", "h.running", t => t.state === "granted", [T_ID, T_AGENT, T_PROJ, T_PID,
    { k: "granted", t: "col.running_for", w: 90, v: t => secs(t.granted), f: t => dur(secs(t.granted)) },
    T_TYPE, T_RAM, T_CPU, T_EST, T_PEAK, T_CMD]],
  ["waiting", "h.waiting", t => t.state === "waiting", [{ k: "position", t: "col.position", num: true, w: 65 },
    T_ID, T_AGENT, T_PROJ, T_PID,
    { k: "created", t: "col.waiting_for", w: 100, v: t => secs(t.created), f: t => dur(secs(t.created)) },
    T_TYPE, T_CPU, T_EST, T_CMD]],
  ["done", "h.done", t => t.state === "done", [T_ID, T_AGENT, T_PID, T_TYPE, T_PEAK,
    { k: "ended", t: "col.ended_ago", w: 95, v: t => secs(t.ended), f: t => dur(secs(t.ended)) }, T_END, T_CMD]],
];
// the dialog's tickets, one table per state that has any, with the main page's columns
const dlgTicketsHtml = tickets => TICKET_TABLES.filter(([, , has]) => tickets.some(has)).map(([id, h]) =>
  `<h3>${esc(T(h))}</h3><div class="wrap"><table id="dlg-${id}"></table></div>`).join("");
const dlgTicketsGrid = tickets => TICKET_TABLES.forEach(([id, , has, cols]) => {
  if (tickets.some(has)) grid("dlg-" + id, cols, tickets.filter(has)); });

// ---------------------------------------------------------------- main view
const pressure = p => p >= 4 ? ["pressure.critical", "bad"] : p >= 2 ? ["pressure.warn", "warn"] : ["pressure.normal", "ok"];
let last = null;  // the last state, so a language switch re-renders without waiting for the next refresh
async function refresh() {
  let v;
  try { v = await (await fetch("/api/state")).json(); } catch (e) {
    document.getElementById("ts").textContent = T("server_down"); return; }
  if (!v.memory) return;
  last = v;
  keepScroll(() => render(v));
}

// A refresh rebuilds the tables and the dialog body: put the page, the dialog and each table back where they were.
function keepScroll(fn) {
  const page = document.scrollingElement, y = page.scrollTop, dy = dlg.scrollTop;
  const tablesIn = () => document.querySelectorAll(".wrap > table[id]");
  const x = Object.fromEntries([...tablesIn()].map(t => [t.id, t.parentNode.scrollLeft]));
  fn();
  page.scrollTop = y; dlg.scrollTop = dy;
  tablesIn().forEach(t => { if (t.id in x) t.parentNode.scrollLeft = x[t.id]; });
}

function render(v) {
  const m = v.memory, [pl, pc] = pressure(m.pressure);
  document.getElementById("ts").textContent = T("updated", { ts: v.ts });
  const swapCls = m.swap_used_gb / Math.max(m.swap_total_gb, 1) > .8 ? "bad" : "ok";
  const tip = (key, l, extra) => T(key, { gb: gb2(l.gb), pct: l.ram_pct, cpu: l.cpu_pct, ...extra });
  const named = (v.outside.builds || []).map(b => [b.project, b.ctype].filter(Boolean).join(" · ") + " — PID " + b.pid);
  const out = v.outside.n ? triangle([tip("tip.outside", v.outside, { n: v.outside.n }), ...named].join("\n")) : "";
  const card = ([k, val, c, mark = "", cardTip = "", wide]) => `<div class="card${wide ? " wide" : ""}"${cardTip ? ` data-tip="${esc(cardTip)}"` : ""}>`
    + `${esc(Array.isArray(k) ? T(...k) : T(k))}${mark}<b class="${c}">${esc(val)}</b></div>`;
  document.getElementById("cards").innerHTML = [[
    ["card.slots", T("card.slots_val", { used: v.used, base: v.base_slots, max: v.max_slots ?? T("card.max_off") }),
      v.used >= v.base_slots ? "warn" : "ok", "", "", true],
    ["card.runner", T(v.counts.runner ? "card.busy" : "card.idle"), v.counts.runner ? "warn" : "ok", "",
      v.counts.runner && v.runner_load ? tip("tip.runner", v.runner_load) : ""],
    ["card.cleanup", T(v.enforce ? "card.cleanup_on" : "card.cleanup_dry"), v.enforce ? "ok" : "warn"],
    ["card.pressure", T(pl), pc],
  ], [
    ["RAM", T("card.ram_val", { used: v.builds_gb, free: v.avail_gb }), "", out, "", true],
    ["card.free", m.free_pct + "%", m.free_pct < 20 ? "bad" : "ok"],
    ["card.avail", T("card.avail_val", { reserve: v.reserve_gb }), v.avail_gb - v.reserve_gb < v.headroom_gb ? "bad" : "ok"],
    ["Swap", `${m.swap_used_gb}/${m.swap_total_gb} GB`, swapCls],
  ], [
    ["card.cpu_builds", v.builds_cpu_pct + "%", "", out],
    ["card.cpu_total", v.cpu_total_pct + "%", "", out],
  ]].map(row => `<div class="cards">${row.map(card).join("")}</div>`).join("");
  const blocked = v.blocked_msg || v.blocked;  // blocked_msg carries the key; blocked is the English text gq prints
  document.getElementById("blocked").textContent = blocked ? T("queue_stopped", { why: tr(blocked) }) : "";

  const outsideRows = (v.outside.builds || []).map(b => ({ ...b, outside: true }));
  const runnerRows = (v.runners || []).map(r =>
    ({ ...r, runner: true, agent: [T("card.runner"), r.runner_name].filter(Boolean).join(" · ") }));
  TICKET_TABLES.forEach(([id, , has, cols]) =>
    grid(id, cols, [...v.tickets.filter(has), ...(id === "running" ? [...runnerRows, ...outsideRows] : [])]));
  grid("agents", [
    { k: "label", t: "col.agent", w: 280, f: a => agentLink(a.pid, a.label) },
    { k: "pid", t: "col.claude_pid", num: true, w: 90, f: a => procLink(a.pid) + (a.alive ? "" : " " + esc(T("dead"))) },
    { k: "rss_gb", t: "col.total_rss", num: true, w: 110, f: a => gb2(a.rss_gb) },
    { k: "ram_pct", t: "% RAM", num: true, w: 70 }, T_CPU,
    { k: "procs", t: "col.procs", num: true, w: 80 }], v.agents);
  grid("procs", PROC_COLS, v.processes);
  document.getElementById("h-est").textContent = T("h.est", { n: v.peak_history });
  document.getElementById("wk-title").textContent = T(v.enforce ? "h.cleanup_on" : "h.cleanup_dry");
  grid("would", [{ k: "pid", t: "PID", num: true, w: 80, f: k => procLink(k.pid) },
    { k: "reason", t: "col.reason", w: 300, v: k => tr(k.reason), f: k => esc(tr(k.reason)) }], v.would_kill);
  grid("est", [{ k: "type", t: "col.type", w: 140 }, { k: "gb", t: "col.estimate_gb", num: true, w: 120 }],
    Object.entries(v.estimates).map(([type, gb]) => ({ type, gb })));
  grid("events", [{ k: "ts", t: "col.time", w: 75 },
    { k: "kind", t: "col.type", w: 90, v: e => T("kind." + e.kind, null, e.kind), f: e => esc(T("kind." + e.kind, null, e.kind)) },
    { k: "msg", t: "col.detail", w: 700, v: e => tr(e.msg ?? e.text), f: e => esc(tr(e.msg ?? e.text)) }], v.events);
  // keep the open dialog live, except while text is selected in it (a rebuild would drop the selection)
  if (dlg.open && current && !String(getSelection())) openDetail(current.type, current.pid, false);
}

// ---------------------------------------------------------------- detail dialog
const dlg = document.getElementById("dlg");
let current = null, trail = [];
const kv = pairs => `<div class="kv">${pairs.filter(p => p[1] !== undefined && p[1] !== null && p[1] !== "")
  .map(([k, v]) => `<div>${esc(T(k))}</div><div>${v}</div>`).join("")}</div>`;

async function openDetail(type, pid, push) {
  const again = current && current.type === type && current.pid === pid;  // a refresh of the detail already shown
  if (push && dlg.open && current && (current.type !== type || current.pid !== pid)) trail.push(current);
  current = { type, pid };
  if (!dlg.open) { trail = []; document.getElementById("dlg-body").innerHTML = esc(T("loading")); dlg.showModal(); }
  let d;
  try { d = await (await fetch(`/api/${type}?pid=${pid}`)).json(); } catch (e) { d = { error_msg: { key: "server_down" } }; }
  if (!current || current.type !== type || current.pid !== pid) return;  // the user moved on while this loaded
  document.getElementById("dlg-back").disabled = !trail.length;
  const body = document.getElementById("dlg-body"), scroll = dlg.scrollTop;
  const show = () => {
    if (d.error || d.error_msg) {
      document.getElementById("dlg-title").textContent = type === "agent" ? T("dlg.agent", { pid }) : "PID " + pid;
      body.innerHTML = `<p class="bad">${esc(tr(d.error_msg || d.error))}</p>`;
    } else if (type === "agent") renderAgent(d, body); else renderProc(d, body);
  };
  if (again) keepScroll(show); else { show(); dlg.scrollTop = scroll; }
}

function renderAgent(a, body) {
  document.getElementById("dlg-title").textContent = a.label;
  body.innerHTML = kv([
    ["col.claude_pid", procLink(a.pid) + (a.alive ? "" : ` <span class="bad">${esc(T("agent_ended"))}</span>`)],
    ["kv.ralphy", a.ralphy ? "#" + esc(a.ralphy) : ""],
    ["kv.session_id", esc(a.session_id)],
    ["kv.transcript", a.transcript ? `<code>${esc(a.transcript)}</code>` : ""],
    ["kv.start", esc(a.lstart)], ["kv.age", esc(a.etime)],
    ["h.procs", a.procs.length],
    ["kv.rss", `${gb2(a.rss_gb)} GB`],
    ["kv.ram_total", esc(T("kv.pct_of", { pct: a.ram_pct, gb: a.total_gb }))],
    ["kv.avail_now", esc(T("kv.pct_of", { pct: a.avail_pct, gb: a.avail_gb }))],
  ]) + `<h3>${esc(T("h.agent_procs"))}</h3><div class="wrap"><table id="dlg-procs"></table></div>`
     + dlgTicketsHtml(a.tickets);
  grid("dlg-procs", PROC_COLS, a.procs);
  dlgTicketsGrid(a.tickets);
}

function renderProc(p, body) {
  document.getElementById("dlg-title").textContent = `PID ${p.pid} · ${p.kind}`;
  body.innerHTML = kv([
    ["kv.agent", ownerOf(p)],
    ["PID", p.pid], ["PPID", procLink(p.ppid)],
    ["kv.root", p.root && p.root !== p.pid ? procLink(p.root) : p.root ? esc(T("this_proc")) : ""],
    ["kv.type", esc(p.kind)], ["kv.state", esc(tr(p.status)) + clientOf(p)],
    ["kv.rss", esc(T("kv.rss_val", { gb: gb2(p.rss_gb), pct: p.ram_pct }))],
    ["kv.tree", esc(T("kv.tree_val", { n: p.tree.length, gb: gb2(p.tree_rss_gb), pct: p.tree_ram_pct }))],
    ["CPU", p.cpu + "%"], ["kv.start", esc(p.lstart)], ["kv.age", esc(p.etime)],
    ["h.ticket", esc(p.ticket)], ["kv.dir", p.cwd ? `<code>${esc(p.cwd)}</code>` : ""],
    ["kv.env", Object.keys(p.env).length
      ? `<code>${Object.entries(p.env).map(([k, v]) => esc(k + "=" + v)).join("<br>")}</code>` : ""],
  ]) + `<h3>${esc(T("h.cmd"))}</h3><pre>${esc(p.cmd)}</pre>`
     + `<h3>${esc(T("h.ancestors"))}</h3><div class="wrap"><table id="dlg-anc"></table></div>`
     + `<h3>${esc(T("h.tree"))}</h3><div class="wrap"><table id="dlg-tree"></table></div>`
     + dlgTicketsHtml(p.tickets);
  grid("dlg-anc", PROC_COLS, p.ancestors);
  grid("dlg-tree", PROC_COLS, p.tree);
  dlgTicketsGrid(p.tickets);
}

document.getElementById("dlg-x").onclick = () => dlg.close();
document.getElementById("dlg-back").onclick = () => { const prev = trail.pop(); if (prev) openDetail(prev.type, prev.pid, false); };
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });  // click on the backdrop
dlg.addEventListener("close", () => { current = null; trail = []; });

// ---------------------------------------------------------------- settings dialog
// One state object holds every value; the simple and the advanced inputs of a key both read and write it.
const cfgDlg = document.getElementById("cfg"), cfgBody = document.getElementById("cfg-body");
const PROFILES = { careful: { headroom_gb: 8, swap_growth_gb: 0.25, extra_gap_s: 60 },
  balanced: { headroom_gb: 6, swap_growth_gb: 0.5, extra_gap_s: 30 },
  bold: { headroom_gb: 4, swap_growth_gb: 1, extra_gap_s: 15 } };
let cfg = null, cfgAdvOpen = false, cfgBusy = false;
const clone = o => JSON.parse(JSON.stringify(o));
const profileOf = v => Object.keys(PROFILES).find(p => Object.entries(PROFILES[p]).every(([k, x]) => v[k] === x)) || "custom";

function shown(spec, v) {
  if (v === null) return T("cfg.off");
  if (spec.kind === "bool") return T("cfg.bool." + v);
  if (spec.kind === "choice") return T(`cfg.${spec.key}.${v}`, null, String(v));
  if (spec.kind === "list") return v.length ? v.join(", ") : "—";
  return String(v);
}

function control(spec) {
  const k = spec.key, lim = spec.min != null ? ` min="${spec.min}" max="${spec.max}"` : "";
  const step = spec.kind === "float" ? ` step="any"` : ` step="1"`;
  if (spec.kind === "bool") return `<label><input type="checkbox" data-k="${k}"> ${esc(T("cfg.bool.true"))}</label>`;
  if (spec.kind === "int" || spec.kind === "float") return `<input type="number" data-k="${k}"${lim}${step}>`;
  if (spec.kind === "int_or_off") return `<label><input type="checkbox" data-k="${k}" data-off> ${esc(T("cfg.off"))}</label>
    <input type="number" data-k="${k}"${lim} step="1">`;
  if (spec.kind === "choice") return `<select data-k="${k}">${spec.choices.map(c =>
    `<option value="${c}">${esc(T(`cfg.${k}.${c}`, null, String(c)))}</option>`).join("")}</select>`;
  if (spec.kind === "ctype") return `<select data-k="${k}">${cfg.ctypes.map(c => `<option>${esc(c)}</option>`).join("")}</select>`;
  if (spec.kind === "list") return `<textarea data-k="${k}" rows="3" spellcheck="false"></textarea>`;
  return `<div class="gb">${cfg.ctypes.map(c => `<label title="${esc(T("cfg.default", { v: cfg.defaults[k][c] }))}">${esc(c)}
    <input type="number" data-k="${k}" data-sub="${c}"${lim} step="any"></label>`).join("")}</div>`;
}

function field(spec, opts) {
  const k = spec.key, def = spec.kind === "gb_table" ? "" : " " + T("cfg.default", { v: shown(spec, cfg.defaults[k]) });
  return `<div class="f"><label>${esc(T("cfg." + k))}</label><div>${control(spec)}
    <div class="help">${esc(T("cfg." + k + ".help") + (opts?.noDefault ? "" : def))}</div>
    ${k === "port" && cfg.port_env ? `<div class="help warn">${esc(T("cfg.port_env"))}</div>` : ""}
    <div class="err" data-err="${k}"></div></div></div>`;
}

function renderCfg() {
  const spec = Object.fromEntries(cfg.spec.map(s => [s.key, s]));
  const prof = Object.keys(PROFILES).map(p => `<label class="prof"><input type="radio" name="prof" value="${p}">
    <b>${esc(T("cfg.profile." + p))}</b> <span class="muted">${esc(T("cfg.profile.desc",
      { headroom: PROFILES[p].headroom_gb, swap: PROFILES[p].swap_growth_gb, gap: PROFILES[p].extra_gap_s }))}</span></label>`).join("")
    + `<label class="prof"><input type="radio" name="prof" value="custom">
    <b>${esc(T("cfg.profile.custom"))}</b> <span class="muted">${esc(T("cfg.profile.custom.desc"))}</span></label>`;
  const auto = cfg.autostart === null
    ? `<input type="checkbox" disabled> <span class="muted">${esc(T("cfg.autostart_none"))}</span>`
    : `<label><input type="checkbox" data-auto> ${esc(T("cfg.bool.true"))}</label>`;
  const groups = ["queue", "memory", "cleanup", "estimates", "server"].map(g => `<h3>${esc(T("cfg.group." + g))}</h3>`
    + cfg.spec.filter(s => s.group === g).map(s => field(s)).join("")).join("");
  cfgBody.innerHTML = `<p class="help">${esc(T("cfg.restart_note"))}</p>`
    + field(spec.base_slots, { noDefault: true }) + field(spec.max, { noDefault: true })
    + `<div class="f"><label>${esc(T("cfg.memory"))}</label><div>${prof}<div class="help">${esc(T("cfg.memory.help"))}</div>
      <div class="err" data-err="headroom_gb"></div><div class="err" data-err="swap_growth_gb"></div>
      <div class="err" data-err="extra_gap_s"></div></div></div>`
    + field(spec.enforce, { noDefault: true })
    + `<div class="f"><label>${esc(T("cfg.autostart"))}</label><div>${auto}<div class="help">${esc(T("cfg.autostart.help"))}</div>
      <div class="err" data-err="autostart"></div></div></div>`
    + `<details${cfgAdvOpen ? " open" : ""}><summary>${esc(T("cfg.advanced"))}</summary>${groups}</details>`;
  cfgBody.querySelector("details").ontoggle = e => cfgAdvOpen = e.target.open;
  syncCfg();
}

// writes the state into every input, except the one being typed in (it would lose the cursor and partial text)
function syncCfg() {
  const v = cfg.values;
  cfgBody.querySelectorAll("[data-k]").forEach(el => {
    if (el === document.activeElement && el.type !== "checkbox") return;
    const k = el.dataset.k, x = v[k];
    if (el.hasAttribute("data-off")) el.checked = x === null;
    else if (el.dataset.sub) el.value = x[el.dataset.sub];
    else if (el.type === "checkbox") el.checked = x;
    else if (el.tagName === "TEXTAREA") el.value = Array.isArray(x) ? x.join("\n") : x;
    else if (k === "max") { el.disabled = x === null; el.value = x ?? cfg.lastMax; }
    else el.value = x;
  });
  const auto = cfgBody.querySelector("[data-auto]");
  if (auto) auto.checked = cfg.autostart;
  const p = profileOf(v);
  cfgBody.querySelectorAll("input[name=prof]").forEach(r => r.checked = r.value === p);
}

// the typed value, or the text itself when it is not a number, so the server reports the wrong type
const num = s => s.trim() !== "" && !isNaN(Number(s)) ? Number(s) : s;
cfgBody.addEventListener("input", e => {
  const el = e.target, v = cfg.values;
  if (el.name === "prof") Object.assign(v, PROFILES[el.value] || {});  // "custom" only marks values set in Advanced
  else if (el.hasAttribute("data-auto")) cfg.autostart = el.checked;
  else if (!el.dataset.k) return;
  else if (el.hasAttribute("data-off")) v.max = el.checked ? null : cfg.lastMax;
  else if (el.dataset.sub) v[el.dataset.k] = { ...v[el.dataset.k], [el.dataset.sub]: num(el.value) };
  else if (el.type === "checkbox") v[el.dataset.k] = el.checked;
  else if (el.tagName === "TEXTAREA") v[el.dataset.k] = el.value.split("\n").map(x => x.trim()).filter(Boolean);
  else if (el.tagName === "SELECT") v[el.dataset.k] = el.dataset.k === "block_pressure" ? Number(el.value) : el.value;
  else { v[el.dataset.k] = num(el.value); if (el.dataset.k === "max" && typeof v.max === "number") cfg.lastMax = v.max; }
  syncCfg();
});

const cfgMsg = (text, cls) => { const m = document.getElementById("cfg-msg"); m.textContent = text || ""; m.className = cls || ""; };
function cfgButtons(on) {
  cfgBusy = !on;
  ["cfg-save", "cfg-reset", "cfg-cancel"].forEach(id => document.getElementById(id).disabled = !on);
}

async function openCfg() {
  cfgMsg(""); cfgBody.innerHTML = esc(T("loading")); cfgButtons(true); cfgDlg.showModal();
  try { cfg = await (await fetch("/api/config")).json(); } catch (e) { cfgBody.textContent = T("server_down"); return; }
  cfg.lastMax = cfg.values.max ?? Math.max(6, cfg.values.base_slots);
  renderCfg();
}

function showErrors(errors) {
  cfgBody.querySelectorAll("[data-err]").forEach(el => el.textContent = errors[el.dataset.err] ? tr(errors[el.dataset.err]) : "");
  const unknown = Object.keys(errors).filter(k => !cfgBody.querySelector(`[data-err="${k}"]`));
  const adv = cfg.spec.some(s => errors[s.key] && !["base_slots", "max", "enforce", "headroom_gb", "swap_growth_gb",
    "extra_gap_s"].includes(s.key));
  if (adv) { cfgAdvOpen = true; cfgBody.querySelector("details").open = true; }
  cfgMsg([T("cfg.invalid"), ...unknown.map(k => k + ": " + tr(errors[k]))].join(" "), "bad");
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function saveCfg() {
  cfgButtons(false); cfgMsg("");
  const body = { values: cfg.values, ...(cfg.autostart === null ? {} : { autostart: cfg.autostart }) };
  let r, d;
  try {
    r = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    d = await r.json();
  } catch (e) { cfgMsg(T("server_down"), "bad"); cfgButtons(true); return; }
  if (!r.ok) {
    if (d.errors) showErrors(d.errors); else cfgMsg(tr(d.error_msg || d.error || r.status), "bad");
    cfgButtons(true); return;
  }
  showErrors({}); cfgMsg(T("cfg.restarting"));
  const moved = String(d.port) !== (location.port || "80"), target = `${location.protocol}//${location.hostname}:${d.port}/`;
  for (const end = Date.now() + 30000; Date.now() < end;) {
    await sleep(1000);
    try {
      if (moved) { await fetch(target + "api/state", { mode: "no-cors", cache: "no-store" }); location.href = target; return; }
      const c = await (await fetch("/api/config", { cache: "no-store" })).json();
      if (c.started !== cfg.started) { location.reload(); return; }
    } catch (e) { /* still restarting */ }
  }
  cfgMsg(T("cfg.restart_failed"), "bad"); cfgButtons(true);
}

document.getElementById("cfg-open").onclick = openCfg;
document.getElementById("cfg-save").onclick = saveCfg;
document.getElementById("cfg-reset").onclick = () => {
  cfg.values = clone(cfg.defaults); cfg.lastMax = Math.max(6, cfg.values.base_slots); showErrors({}); cfgMsg(""); syncCfg(); };
document.getElementById("cfg-cancel").onclick = document.getElementById("cfg-x").onclick = () => cfgDlg.close();
cfgDlg.addEventListener("cancel", e => { if (cfgBusy) e.preventDefault(); });  // Esc during the restart wait
cfgDlg.addEventListener("click", e => { if (e.target === cfgDlg && !cfgBusy) cfgDlg.close(); });

const deep = location.hash.match(/^#(agent|proc)=(\d+)$/);  // direct link to a dialog: #agent=PID or #proc=PID
if (deep) openDetail(deep[1], +deep[2], true);
document.getElementById("lang").onchange = e => {
  lang = localStorage.bqLang = e.target.value;
  applyLang();
  if (last) keepScroll(() => render(last));  // also re-renders the open dialog
  if (cfgDlg.open && cfg) renderCfg();
};
applyLang();
refresh(); setInterval(refresh, 2000);
</script>
</body>
