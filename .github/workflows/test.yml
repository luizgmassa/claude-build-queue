name: test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psutil
        run: python -m pip install "psutil>=6"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Live queue check
        run: python tests/live_check.py

  install-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install twice, so the second install replaces the running server
        shell: pwsh
        run: |
          ./install.ps1
          ./install.ps1
      - name: Server answers and gq runs a command through it from Git Bash
        shell: bash
        run: |
          for i in $(seq 30); do curl -sf http://127.0.0.1:8787/api/state > /dev/null && break; sleep 1; done
          ~/.local/bin/gq status
          ~/.local/bin/gq run -- python -c "print('queued-ok')" | grep queued-ok
      - name: Server log
        if: always()
        shell: pwsh
        run: Get-Content "$HOME\.local\share\build-queue\server.log" -ErrorAction SilentlyContinue
