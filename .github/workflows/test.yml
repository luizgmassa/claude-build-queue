name: test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psutil
        run: python -m pip install "psutil>=6"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Live queue check
        run: python tests/live_check.py

  install-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install twice, so the second install replaces the running server
        shell: pwsh
        run: |
          ./install.ps1
          ./install.ps1
      - name: Server answers and gq runs a command through it from Git Bash
        shell: bash
        run: |
          for i in $(seq 30); do curl -sf http://127.0.0.1:8787/api/state > /dev/null && break; sleep 1; done
          ~/.local/bin/gq status
          ~/.local/bin/gq run -- python -c "print('queued-ok')" | grep queued-ok
      - name: Save & Apply restarts the task with the new settings and switches the start with the system
        shell: bash
        run: |
          py=~/.local/share/build-queue/venv/Scripts/python.exe
          get() { curl -sf http://127.0.0.1:8787/api/config | "$py" -c "import json,sys; d=json.load(sys.stdin); print($1, end='')"; }
          post() { curl -sf -H 'Content-Type: application/json' -d "$1" http://127.0.0.1:8787/api/config; echo; }
          wait_restart() {
            for i in $(seq 90); do sleep 1; s=$(get 'd["started"]' 2>/dev/null) && [ "$s" != "$1" ] && return 0; done
            echo "server did not come back" >&2; return 1
          }
          s0=$(get 'd["started"]'); [ "$(get 'd["autostart"]')" = True ]
          post '{"values": {"max": 5}, "autostart": false}'
          wait_restart "$s0"
          [ "$(get 'd["values"]["max"], d["autostart"]')" = "5 False" ]
          s1=$(get 'd["started"]')
          post '{"values": {"max": null}, "autostart": true}'
          wait_restart "$s1"
          [ "$(get 'd["values"]["max"], d["autostart"]')" = "None True" ]
          ~/.local/bin/gq run -- python -c "print('after-restart-ok')" | grep after-restart-ok
      - name: Server log
        if: always()
        shell: pwsh
        run: |
          Get-Content "$HOME\.local\share\build-queue\server.log" -ErrorAction SilentlyContinue
          "--- restart.log"
          Get-Content "$HOME\.local\share\build-queue\restart.log" -ErrorAction SilentlyContinue
          "--- task"
          Get-ScheduledTask -TaskName com.massa.build-queue | Select-Object State, @{n="Trigger";e={$_.Triggers[0].Enabled}}
          Get-ScheduledTaskInfo -TaskName com.massa.build-queue | Select-Object LastRunTime, LastTaskResult
